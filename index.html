<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
overflow:hidden;
background:linear-gradient(135deg,#ff4d88,#ff80ab,#ffc1d9);
display:flex;
justify-content:center;
align-items:center;
color:white;
position:relative;
}

/* Intro Popup */

#welcomePopup{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
display:flex;
justify-content:center;
align-items:center;
z-index:100;
backdrop-filter:blur(8px);
animation:fadeIn 1s;
}

.popup-box{
background:rgba(255,255,255,0.15);
padding:40px;
border-radius:30px;
text-align:center;
box-shadow:0 0 40px rgba(255,255,255,0.4);
animation:pop 1s infinite alternate;
}

.popup-box h1{
font-size:2.5rem;
margin-bottom:20px;
}

.popup-box button{
padding:15px 35px;
border:none;
border-radius:30px;
background:white;
color:#ff4081;
font-size:1.2rem;
cursor:pointer;
font-weight:bold;
}

@keyframes pop{
from{transform:scale(1);}
to{transform:scale(1.05);}
}

/* Floating Hearts */

.heart{
position:absolute;
animation:float 6s linear infinite;
opacity:0.8;
}

@keyframes float{
0%{
transform:translateY(100vh) scale(1);
opacity:1;
}
100%{
transform:translateY(-10vh) scale(1.6);
opacity:0;
}
}

/* Login */

.container{
z-index:10;
background:rgba(255,255,255,0.15);
padding:30px;
border-radius:30px;
backdrop-filter:blur(10px);
text-align:center;
box-shadow:0 0 35px rgba(255,255,255,0.3);
display:none;
}

.container h1{
margin-bottom:20px;
font-size:2.3rem;
}

/* Password Display */

#display{
width:220px;
height:55px;
border:none;
border-radius:20px;
text-align:center;
font-size:2rem;
margin-bottom:20px;
color:#ff4081;
}

/* Keypad */

.keypad{
display:grid;
grid-template-columns:repeat(3,70px);
gap:15px;
justify-content:center;
}

.key{
width:70px;
height:70px;
border:none;
border-radius:50%;
font-size:1.5rem;
background:white;
color:#ff4081;
cursor:pointer;
transition:0.3s;
box-shadow:0 0 20px rgba(255,255,255,0.5);
}

.key:hover{
transform:scale(1.1);
}

/* Surprise */

#surprise{
display:none;
position:absolute;
text-align:center;
padding:20px;
animation:fadeIn 2s;
z-index:10;
}

#message{
font-size:4rem;
font-weight:bold;
text-shadow:0 0 25px white;
animation:pulse 2s infinite alternate;
}

@keyframes pulse{
from{transform:scale(1);}
to{transform:scale(1.05);}
}

.photo-gallery{
margin-top:30px;
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}

.photo-gallery img{
width:220px;
height:220px;
object-fit:cover;
display:block;
border-radius:25px;
border:5px solid white;
box-shadow:0 0 25px rgba(255,255,255,0.8);
transition:0.4s;
}

.photo-gallery img:hover{
transform:scale(1.08);
}

h2{
margin-top:25px;
font-size:2rem;
text-shadow:0 0 20px white;
}

@keyframes fadeIn{
from{
opacity:0;
transform:scale(0.8);
}
to{
opacity:1;
transform:scale(1);
}
}

/* Mobile */

@media(max-width:768px){

body{
overflow:auto;
padding:20px;
}

.popup-box{
width:90%;
padding:25px;
}

.popup-box h1{
font-size:2rem;
}

#message{
font-size:2.2rem;
}

.photo-gallery{
flex-direction:column;
align-items:center;
}

.photo-gallery img{
width:260px;
height:260px;
}

.keypad{
grid-template-columns:repeat(3,65px);
}

.key{
width:65px;
height:65px;
}

}

</style>
</head>

<body>

<!-- MUSIC -->
<audio id="bgMusic" loop>
<source src="song.mp3" type="audio/mpeg">
</audio>

<!-- INTRO POPUP -->

<div id="welcomePopup">

<div class="popup-box">

<h1>💖 A Special Surprise For You 💖</h1>

<button onclick="startSite()">Open Surprise 💌</button>

</div>

</div>

<!-- LOGIN -->

<div class="container" id="loginBox">

<h1>🔐 Enter Secret Password 🔐</h1>

<input type="password" id="display" disabled>

<div class="keypad">

<button class="key" onclick="press('1')">1</button>
<button class="key" onclick="press('2')">2</button>
<button class="key" onclick="press('3')">3</button>

<button class="key" onclick="press('4')">4</button>
<button class="key" onclick="press('5')">5</button>
<button class="key" onclick="press('6')">6</button>

<button class="key" onclick="press('7')">7</button>
<button class="key" onclick="press('8')">8</button>
<button class="key" onclick="press('9')">9</button>

<button class="key" onclick="clearPass()">❌</button>
<button class="key" onclick="press('0')">0</button>
<button class="key" onclick="checkPassword()">💖</button>

</div>

</div>

<!-- SURPRISE -->

<div id="surprise">

<div id="message">

Happy Birthday Akhiluuuuuu ❤️<br>
Loveee from Geethuuuu 💖

</div>

<div class="photo-gallery">

<img src="./photo1.jpeg">
<img src="./photo2.jpeg">
<img src="./photo3.jpeg">

</div>

<h2>
✨ I loveeeeee Youuu Buddiii ✨
</h2>

</div>

<script>

let password="";

/* Start */

function startSite(){

document.getElementById("welcomePopup").style.display="none";

document.getElementById("loginBox").style.display="block";

let music = document.getElementById("bgMusic");

music.currentTime = 32;

music.play();

}

/* Password */

function press(num){

if(password.length<4){

password+=num;

document.getElementById("display").value="•".repeat(password.length);

}

}

function clearPass(){

password="";

document.getElementById("display").value="";

}

function checkPassword(){

if(password==="2416"){

document.getElementById("loginBox").style.display="none";

document.getElementById("surprise").style.display="block";

launchHearts();

}else{

alert("Wrong Password 💔");

clearPass();

}

}

/* Hearts */

function createHeart(){

const heart=document.createElement("div");

heart.classList.add("heart");

heart.innerHTML="💖";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=Math.random()*35+20+"px";

heart.style.animationDuration=Math.random()*3+3+"s";

document.body.appendChild(heart);

setTimeout(()=>{

heart.remove();

},6000);

}

setInterval(createHeart,250);

function launchHearts(){

for(let i=0;i<40;i++){

setTimeout(createHeart,i*120);

}

}

</script>

</body>
</html>
